{% extends 'base.html' %}{% block content %}<h1>SRS studio</h1><div class="grid"><aside class="card side"><h3>Workspace</h3><button class="secondary" id="new">New project</button><p><a href="/llm2/">Open LLM2 SDLC studio</a></p></aside><section class="card"><div class="chat" id="chat" role="log" aria-live="polite">{% for turn in history %}<div class="turn {{turn.role}}"><span class="role">{{turn.role}}</span>{{turn.content}}</div>{% empty %}<div id="welcome"><p>Describe your project to begin.</p></div>{% endfor %}</div><form id="composer">{% csrf_token %}<label for="message">Message</label><textarea id="message" rows="3" maxlength="10000" placeholder="Describe your networking project…" required>{{ draft }}</textarea><div class="actions"><button id="send">Send</button><button type="button" class="secondary" id="generate">Generate SRS</button></div></form><p id="status" role="status"></p><a id="download" class="button" href="/download/" {% if not report_ready %}hidden{% endif %}>Download SRS (.docx)</a></section></div><script>
const chat=document.querySelector('#chat'),status=document.querySelector('#status'),csrf=document.querySelector('[name=csrfmiddlewaretoken]').value;
function turn(role,text){document.querySelector('#welcome')?.remove();const el=document.createElement('div');el.className='turn '+role;const name=document.createElement('span');name.className='role';name.textContent=role;el.append(name,document.createTextNode(text));chat.append(el);chat.scrollTop=chat.scrollHeight;}
async function call(url,data){let timer=null;if(url==='/report/'){timer=setInterval(async()=>{try{const r=await fetch('/progress/');if(r.ok){const p=await r.json();status.textContent=p.status;}}catch{}},3000);}document.querySelectorAll('button:not(#theme-toggle):not(#idle-stay)').forEach(b=>b.disabled=true);status.textContent=url==='/report/'?'Generating SRS…':'Working…';try{const r=await fetch(url,{method:'POST',headers:{'X-CSRFToken':csrf},body:new URLSearchParams(data)});if(r.redirected){location.href=r.url;return;}const result=await r.json();if(r.status===401&&result.expired){location.href=result.redirect||'/';return null;}if(!r.ok)throw Error(result.error||'Request failed');status.textContent='';return result;}catch(e){status.textContent=e.message;return null;}finally{if(timer)clearInterval(timer);document.querySelectorAll('button:not(#theme-toggle):not(#idle-stay)').forEach(b=>b.disabled=false);}}
document.querySelector('#composer').onsubmit=async e=>{e.preventDefault();const box=document.querySelector('#message'),message=box.value.trim();if(!message)return;const r=await call('/chat/',{message});if(r){turn('user',message);turn('assistant',r.reply);box.value='';document.querySelector('#download').hidden=true;}};
document.querySelector('#generate').onclick=async()=>{const r=await call('/report/',{});if(r){const a=document.querySelector('#download');a.href=r.download;a.hidden=false;status.textContent=r.status;}};
document.querySelector('#new').onclick=async()=>{if(await call('/new/',{}))location.reload();};
</script>{% endblock %}
